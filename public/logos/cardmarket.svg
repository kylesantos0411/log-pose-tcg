<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005bb5" />
      <stop offset="100%" stop-color="#003366" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#cmGrad)" />
  
  <!-- Outer Card outline (angled) -->
  <rect x="26" y="28" width="30" height="42" rx="4" transform="rotate(-12 41 49)" fill="#0077d4" stroke="#ffffff" stroke-width="2" />
  
  <!-- Fore Card (straight) -->
  <rect x="42" y="26" width="32" height="46" rx="4.5" fill="#ffffff" stroke="#003366" stroke-width="1.5" />
  
  <!-- Cardmarket 'C' / 'M' minimal logo emblem inside card -->
  <circle cx="58" cy="42" r="9" fill="#005bb5" />
  <path d="M54 42 A4 4 0 0 1 62 42" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" />
  <rect x="47" y="56" width="22" height="4" rx="2" fill="#005bb5" />
</svg>
